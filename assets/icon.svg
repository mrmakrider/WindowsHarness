<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003087;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a86b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007a4f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rect -->
  <rect x="8" y="8" width="240" height="240" rx="32" fill="url(#bg)"/>
  
  <!-- Circuit board pattern -->
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3">
    <path d="M48 80 h160 M48 128 h160 M48 176 h160"/>
    <path d="M80 48 v160 M128 48 v160 M176 48 v160"/>
    <circle cx="80" cy="80" r="8"/>
    <circle cx="176" cy="80" r="8"/>
    <circle cx="80" cy="176" r="8"/>
    <circle cx="176" cy="176" r="8"/>
  </g>
  
  <!-- Main "H" letter -->
  <text x="128" y="158" font-family="Arial, sans-serif" font-size="100" font-weight="bold" 
        fill="white" text-anchor="middle" dominant-baseline="middle">H</text>
  
  <!-- Subtitle -->
  <text x="128" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="500"
        fill="#00a86b" text-anchor="middle" dominant-baseline="middle">WindowsHarness</text>
  
  <!-- AI spark -->
  <g transform="translate(180, 50)">
    <polygon points="10,0 12,5 17,5 13,8 15,13 10,10 5,13 7,8 3,5 8,5" fill="#d4af37"/>
    <circle cx="10" cy="6.5" r="2" fill="#fff"/>
  </g>
</svg>
